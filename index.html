<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Interactive Menu - Cafe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            background: #111;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .menu-container {
            width: 100%;
            max-width: 1024px;
            margin: 0 auto;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* ── Navigation Bar ─────────────────────────── */
        .nav-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: linear-gradient(to bottom, rgba(0,0,0,0.55) 0%, transparent 100%);
            padding: 16px 16px 32px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .nav-bar::-webkit-scrollbar { display: none; }

        .nav-btn {
            padding: 8px 16px;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 999px;
            cursor: pointer;
            font-size: clamp(11px, 2.5vw, 13px);
            font-weight: 600;
            white-space: nowrap;
            color: rgba(255,255,255,0.8);
            letter-spacing: 0.02em;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: background 0.25s, color 0.25s, border-color 0.25s;
            flex-shrink: 0;
        }

        .nav-btn.active {
            background: white;
            color: #111;
            border-color: white;
        }

        /* ── Slider ─────────────────────────────────── */
        .pages-track {
            display: flex;
            width: 100%;
            height: 100%;
            will-change: transform;
        }

        .pages-track.animating {
            transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .menu-page {
            flex-shrink: 0;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .menu-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* ── Dot Indicator ──────────────────────────── */
        .dot-indicator {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 7px;
            align-items: center;
            z-index: 100;
            background: rgba(0,0,0,0.35);
            padding: 7px 13px;
            border-radius: 999px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .dot {
            height: 6px;
            width: 6px;
            border-radius: 999px;
            background: rgba(255,255,255,0.4);
            cursor: pointer;
            transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s ease;
        }

        .dot.active { width: 22px; background: white; }

        /* ── Loading ────────────────────────────────── */
        .loading {
            position: fixed;
            inset: 0;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.4s ease;
        }

        .loading.hidden { opacity: 0; pointer-events: none; }

        .loading-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            color: #666;
            font-size: 12px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .spinner {
            width: 26px;
            height: 26px;
            border: 2px solid #333;
            border-top-color: #888;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Gesture hint ───────────────────────────── */
        .gesture-hint {
            position: absolute;
            bottom: 58px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.5);
            color: rgba(255,255,255,0.85);
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 11px;
            z-index: 99;
            white-space: nowrap;
            pointer-events: none;
            animation: hintIn 0.4s ease 0.8s both, hintOut 0.5s ease 3.8s forwards;
        }

        @keyframes hintIn {
            from { opacity: 0; transform: translateX(-50%) translateY(6px); }
            to   { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        @keyframes hintOut { to { opacity: 0; visibility: hidden; } }
    </style>
</head>
<body>

<div class="loading" id="loading">
    <div class="loading-inner">
        <div class="spinner"></div>
        <span>Loading Menu</span>
    </div>
</div>

<div class="menu-container" id="menuContainer">
    <div class="nav-bar" id="navBar"></div>
    <div class="pages-track" id="pagesTrack"></div>
    <div class="dot-indicator" id="dotIndicator"></div>
    <div class="gesture-hint">← Swipe untuk navigasi →</div>
</div>

<script>
    const pages = [
        { title: 'Signature Espresso', image: '01 Signature Espresso Based.png' },
        { title: 'Manual Brew',        image: '00 Manual Brew Selection.png' },
        { title: 'Others Menu',        image: '00 Others Menu.png' },
        { title: 'Signature Grilled',  image: 'FOOD MENU 2026 01.png' },
        { title: 'Rice Bowl',          image: 'FOOD MENU 2026 02.png' },
        { title: 'Pasta & Sharing',    image: 'FOOD MENU 2026 03.png' },
    ];

    let current = 0;
    let isAnimating = false;

    const track  = document.getElementById('pagesTrack');
    const navBar = document.getElementById('navBar');
    const dotWrap = document.getElementById('dotIndicator');

    /* ── Build ─────────────────────────────────────── */
    function build() {
        const n = pages.length;

        // Track width = N × 100% of container
        track.style.width = `${n * 100}%`;

        track.innerHTML = pages.map((p, i) => `
            <div class="menu-page" style="width:${100/n}%">
                <img src="${p.image}" alt="${p.title}" class="menu-image"
                     draggable="false" loading="${i === 0 ? 'eager' : 'lazy'}">
            </div>
        `).join('');

        updateNav();
        updateDots();
        setPos(false);
    }

    function updateNav() {
        navBar.innerHTML = pages.map((p, i) => `
            <button class="nav-btn ${i === current ? 'active' : ''}" onclick="goTo(${i})">${p.title}</button>
        `).join('');
    }

    function updateDots() {
        dotWrap.innerHTML = pages.map((_, i) => `
            <div class="dot ${i === current ? 'active' : ''}" onclick="goTo(${i})"></div>
        `).join('');
    }

    /* ── Motion ────────────────────────────────────── */
    function setPos(animate) {
        if (animate) {
            track.classList.add('animating');
            isAnimating = true;
            track.addEventListener('transitionend', () => {
                track.classList.remove('animating');
                isAnimating = false;
            }, { once: true });
        }
        track.style.transform = `translateX(${-(current / pages.length) * 100}%)`;
    }

    /* ── Navigate ──────────────────────────────────── */
    function goTo(index) {
        if (index === current || isAnimating) return;
        if (index < 0 || index >= pages.length) return;
        current = index;
        setPos(true);
        updateNav();
        updateDots();
        navBar.querySelectorAll('.nav-btn')[current]
              ?.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }

    function step(dir) { goTo(current + dir); }

    /* ── Touch ─────────────────────────────────────── */
    let tx0 = 0, ty0 = 0;
    const cont = document.getElementById('menuContainer');

    cont.addEventListener('touchstart', e => {
        tx0 = e.touches[0].clientX;
        ty0 = e.touches[0].clientY;
    }, { passive: true });

    cont.addEventListener('touchend', e => {
        const dx = e.changedTouches[0].clientX - tx0;
        const dy = e.changedTouches[0].clientY - ty0;
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 44) step(dx < 0 ? 1 : -1);
    }, { passive: true });

    /* ── Keyboard ──────────────────────────────────── */
    document.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft')  step(-1);
        if (e.key === 'ArrowRight') step(1);
    });

    /* ── Init ──────────────────────────────────────── */
    build();

    const firstImg = track.querySelector('img');
    const hideLoader = () => {
        const el = document.getElementById('loading');
        if (!el) return;
        el.classList.add('hidden');
        setTimeout(() => el.remove(), 420);
    };
    firstImg.complete ? setTimeout(hideLoader, 250)
                      : firstImg.addEventListener('load', hideLoader, { once: true });
    firstImg.addEventListener('error', hideLoader, { once: true });
    setTimeout(hideLoader, 2500);
</script>
</body>
</html>
